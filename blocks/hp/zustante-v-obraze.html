<!-- ZŮSTAŇTE V OBRAZE – newsletter vlevo, dva promo bannery vpravo.
     Nadpis sekce je v bloku hp/novinky-nadpis.html. Video smyčky: js/loop-video.js. -->
<section>
  <div class="container-main">
    <div class="layout-grid stay-grid">

    <div class="newsletter g-col-12 g-col-lg-6">
      <div class="newsletter-media">
        <!-- zástupný obrázek -->
        <img src="https://www.central-group.cz/Uloziste/0e/0eefd926-f099-4d5d-a3c6-bba84ba408ea.jpg" alt="">
        <!-- bg video   -->
        
          <video data-loop-video muted loop playsinline preload="none"
                 aria-hidden="true" tabindex="-1"
                 poster="https://www.central-group.cz/Uloziste/0e/0eefd926-f099-4d5d-a3c6-bba84ba408ea.jpg">
            <!--source src="video/newsletter.webm" type="video/webm"-->
            <source src="https://www.central-group.cz/storage/CG/wms3/video/hp/hp-newsletter.mp4" type="video/mp4">
          </video>
          
      </div>
      <div class="newsletter-form">
        <div class="space-y gap-safe">
          <div>
            <h3 class="brow brow-yellow text-yellow bold mb-0">Registrujte se</h3>
            <p class="newsletter-text">
              pro přednostní zasílání novinek<br>
              a získejte řadu výhod
            </p>
          </div>
          <div>
            <div class="row g-2">
              <div class="col-12 col-lg-auto">
                <input type="text" id="newsletter-name" name="name" autocomplete="name" placeholder="Jméno a příjmení" class="w-100 w-lg-auto">
              </div>
              <div class="col-12 col-lg-auto">
                <input type="email" id="newsletter-email" name="email" autocomplete="email" required="" placeholder="Váš e-mail *" class="w-100 w-lg-auto">
              </div>
              <div class="col-12">
                <label class="newsletter-consent">
                  <input type="checkbox" name="consent" required="">
                  <span style="user-select: none;">Souhlasím se zpracováním <a href="/page/osobni-udaje">osobních údajů</a>.</span>
                </label>
              </div>
            </div>
          </div>
          <div>
            <button type="submit" class="btn btn-primary">
              Přihlásit k odběru <i class="fa-sharp fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
      <!-- telefon přesahující spodní hranu karty -->
      <img class="newsletter-phone" src="img/newsform-mobile.png" alt="" aria-hidden="true">
    </div>

      <div class="promos g-col-12 g-col-lg-6">

        <!-- Koupíme váš pozemek – video smyčka vpravo, do ztracena směrem do textu -->
        <article class="promo">
          <div class="promo-media">
            <!-- zástupný obrázek = poster/fallback -->
            <img src="https://www.central-group.cz/storage/CG/wms3/img/pages/hp/hp-banner-pozemky.webp" alt="">
            <video data-loop-video muted loop playsinline preload="none"
                   aria-hidden="true" tabindex="-1"
                   poster="https://www.central-group.cz/storage/CG/wms3/img/pages/hp/hp-banner-pozemky.webp">
              <!--source src="video/pozemky.webm" type="video/webm"-->
              <source src="https://www.central-group.cz/storage/CG/wms3/video/hp/hp-pozemky.mp4" type="video/mp4">
            </video>
          </div>
          <div class="promo-body">
            <div class="space-y-2 gap-safe">
              <h4 class="mb-0">
                Koupíme<br>
                <strong>váš pozemek</strong>
              </h4>
              <p class="small">Nepotřebujeme úvěry</p>
              <a href="https://www.central-group.cz/page/koupime-pozemky?jv=1" class="btn btn-primary">
                Zjistit více <i class="fa-sharp fa-solid fa-arrow-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>
        </article>

        <!-- Magazín 2026 – obrázek přesahuje spodní hranu karty -->
        <article class="promo promo--overflow">
          <div class="promo-body">
            <div class="space-y-2 gap-safe">
              <h4 class="mb-0">
                <strong>Magazín 2026</strong>
              </h4>
              <p class="small">
                trendy na trhu, inspirace<br>
                a novinky pro nové bydlení
              </p>
              <a href="https://www.central-group.cz/page/central-magazin?jv=1" class="btn btn-primary">
                Přečíst <i class="fa-sharp fa-solid fa-arrow-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>
          <img class="promo-image" src="img/banner-magazine.png" alt="" aria-hidden="true">
        </article>

      </div>
    </div>
  </div>
</section>
